<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>みかん | Mikan Official Website</title>
  <!-- Google Fonts: Zen Kaku Gothic New, Noto Sans JP & Caveat (Script) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="min-h-screen flex flex-col selection:bg-mikan-200 selection:text-mikan-700">

  <!-- Navigation Header (Clean White + Right Square Navy Menu Trigger) -->
  <header class="sticky top-0 z-40 glass-nav border-b border-slate-100 transition-all">
    <div class="max-w-7xl mx-auto pl-4 sm:pl-8 h-20 flex items-center justify-between">
      <!-- Brand Logo -->
      <a href="#home" onclick="navigateTo('home', event)" class="flex items-center gap-3.5 group focus:outline-none">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-mikan-500 via-mikan-400 to-accent-blue flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
          <span class="text-white font-display font-black text-base tracking-tighter">M</span>
        </div>
        <div class="flex items-baseline gap-2.5">
          <span class="font-display font-bold text-xl sm:text-2xl tracking-wider text-charcoal group-hover:text-mikan-500 transition-colors">みかん</span>
          <span class="hidden sm:inline-block text-[11px] font-medium tracking-widest text-slate-400 uppercase">Mikan Official</span>
        </div>
      </a>

      <!-- Right Nav & Square Navy Menu Button -->
      <div class="flex items-center h-full">
        <!-- Desktop Horizontal Links -->
        <nav class="hidden md:flex items-center gap-2 lg:gap-5 pr-6 lg:pr-10" id="desktop-nav">
          <button data-route="home" onclick="navigateTo('home')" class="nav-btn px-3 py-2 text-sm font-bold tracking-wide transition-all">Home</button>
          <button data-route="products" onclick="navigateTo('products')" class="nav-btn px-3 py-2 text-sm font-bold tracking-wide transition-all">プロダクト</button>
          <button data-route="news" onclick="navigateTo('news')" class="nav-btn px-3 py-2 text-sm font-bold tracking-wide transition-all flex items-center gap-1.5">
            お知らせ
            <span class="w-1.5 h-1.5 rounded-full bg-mikan-500"></span>
          </button>
          <button data-route="sns" onclick="navigateTo('sns')" class="nav-btn px-3 py-2 text-sm font-bold tracking-wide transition-all">SNS</button>
          <button data-route="contact" onclick="navigateTo('contact')" class="nav-btn px-3 py-2 text-sm font-bold tracking-wide transition-all">お問い合わせ</button>
        </nav>

        <!-- Signature Right Square Navy Menu Button -->
        <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="w-20 h-20 bg-mikan-500 hover:bg-mikan-600 text-white flex flex-col items-center justify-center transition-colors shrink-0" aria-label="メニューを開く">
          <div class="space-y-1.5">
            <span class="block w-6 h-0.5 bg-white"></span>
            <span class="block w-6 h-0.5 bg-white"></span>
            <span class="block w-4 h-0.5 bg-white ml-auto"></span>
          </div>
        </button>
      </div>
    </div>

    <!-- Expandable Navigation Drawer -->
    <div id="mobile-menu" class="hidden border-t border-slate-100 bg-white px-6 py-6 shadow-xl">
      <div class="max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
        <button data-route="home" onclick="navigateTo('home'); toggleMobileMenu()" class="mobile-nav-btn text-left px-4 py-3.5 rounded-xl font-bold text-sm flex items-center justify-between border border-slate-100 hover:border-mikan-300 transition-colors">
          <span>Home</span><i data-lucide="chevron-right" class="w-4 h-4 text-mikan-500"></i>
        </button>
        <button data-route="products" onclick="navigateTo('products'); toggleMobileMenu()" class="mobile-nav-btn text-left px-4 py-3.5 rounded-xl font-bold text-sm flex items-center justify-between border border-slate-100 hover:border-mikan-300 transition-colors">
          <span>プロダクト</span><i data-lucide="chevron-right" class="w-4 h-4 text-mikan-500"></i>
        </button>
        <button data-route="news" onclick="navigateTo('news'); toggleMobileMenu()" class="mobile-nav-btn text-left px-4 py-3.5 rounded-xl font-bold text-sm flex items-center justify-between border border-slate-100 hover:border-mikan-300 transition-colors">
          <span>お知らせ</span><i data-lucide="chevron-right" class="w-4 h-4 text-mikan-500"></i>
        </button>
        <button data-route="sns" onclick="navigateTo('sns'); toggleMobileMenu()" class="mobile-nav-btn text-left px-4 py-3.5 rounded-xl font-bold text-sm flex items-center justify-between border border-slate-100 hover:border-mikan-300 transition-colors">
          <span>SNS</span><i data-lucide="chevron-right" class="w-4 h-4 text-mikan-500"></i>
        </button>
        <button data-route="contact" onclick="navigateTo('contact'); toggleMobileMenu()" class="mobile-nav-btn text-left px-4 py-3.5 rounded-xl font-bold text-sm flex items-center justify-between border border-slate-100 hover:border-mikan-300 transition-colors">
          <span>お問い合わせ</span><i data-lucide="chevron-right" class="w-4 h-4 text-mikan-500"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area (Dynamic SPA Router View) -->
  <main id="app-view" class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <!-- Content rendered via JS -->
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-mikan-700/50 backdrop-blur-sm transition-opacity" onclick="closeModalOnBackdrop(event)">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[88vh] overflow-y-auto shadow-2xl border border-slate-100 p-6 sm:p-8 relative animate-[fadeSlideUp_0.25s_ease-out]">
      <button onclick="closeModal()" class="sticky top-0 float-right p-2.5 rounded-full bg-mikan-50 text-mikan-500 hover:bg-mikan-500 hover:text-white transition-colors" aria-label="閉じる">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modal-body" class="clear-both pt-2">
        <!-- Dynamic Modal Content -->
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-mikan-500 text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium">
      <span class="w-2.5 h-2.5 rounded-full bg-accent-blue"></span>
      <span id="toast-message">通知メッセージ</span>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-mikan-50/70 border-t border-mikan-100 mt-16">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-12">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 pb-8 border-b border-mikan-100">
        <div class="md:col-span-2 space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full bg-mikan-500 flex items-center justify-center text-white font-display font-black text-base">M</div>
            <span class="font-display font-bold text-xl tracking-wider text-charcoal">みかん (Mikan)</span>
          </div>
        </div>

        <div>
          <h3 class="font-display font-bold text-sm text-mikan-500 mb-3 tracking-wider">ページ一覧</h3>
          <ul class="space-y-2 text-sm text-slate-600">
            <li><a href="#home" onclick="navigateTo('home', event)" class="hover:text-mikan-500 transition-colors">Home (トップ)</a></li>
            <li><a href="#products" onclick="navigateTo('products', event)" class="hover:text-mikan-500 transition-colors">プロダクト</a></li>
            <li><a href="#news" onclick="navigateTo('news', event)" class="hover:text-mikan-500 transition-colors">お知らせ</a></li>
            <li><a href="#sns" onclick="navigateTo('sns', event)" class="hover:text-mikan-500 transition-colors">公式SNSリンク</a></li>
            <li><a href="#contact" onclick="navigateTo('contact', event)" class="hover:text-mikan-500 transition-colors">お問い合わせ</a></li>
          </ul>
        </div>
      </div>

      <div class="pt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
        <p>&copy; 2026 みかん (Mikan). All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Application Logic & Data -->
    <!-- Application scripts: dependency order -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/pages/home.js"></script>
  <script src="assets/js/pages/products.js"></script>
  <script src="assets/js/pages/news.js"></script>
  <script src="assets/js/pages/sns.js"></script>
  <script src="assets/js/pages/contact.js"></script>
  <script src="assets/js/pages/not-found.js"></script>
  <script src="assets/js/modals.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
