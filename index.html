              700: '#1B5E20',

            cream: '#FFFDF9',

  <style>
    body {
      background-color: #FFFDF9;
      color: #2D2926;
      overflow-x: hidden;
    }
    .glass-nav {
      background: rgba(255, 253, 249, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .page-transition {
      animation: fadeSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .animate-float {
      animation: floatSlow 5s ease-in-out infinite;
    }
    /* Rich text content styling from microCMS */
    .cms-content h1, .cms-content h2, .cms-content h3 {
      font-weight: 700;
      margin-top: 1.25em;
      margin-bottom: 0.5em;
      color: #2D2926;

    .cms-content h2 { font-size: 1.25rem; border-left: 4px solid #FF7A00; padding-left: 0.75rem; }
    .cms-content p { margin-bottom: 1em; line-height: 1.8; }
    .cms-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1em; }
    .cms-content a { color: #FF7A00; text-decoration: underline; }
    .cms-content img { border-radius: 1rem; margin: 1rem 0; max-width: 100%; height: auto; }

<body class="min-h-screen flex flex-col selection:bg-mikan-200 selection:text-charcoal">

      <button data-route="contact" onclick="navigateTo('contact'); toggleMobileMenu()" class="mobile-nav-btn w-full text-left px-4 py-3 rounded-xl font-bold flex items-center justify-between">

      </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-charcoal text-white px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-3 text-sm font-medium">
      <span class="w-2.5 h-2.5 rounded-full bg-mikan-400"></span>

  <!-- Footer -->

        <div class="md:col-span-2 space-y-4">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-mikan-500 flex items-center justify-center text-white font-display font-black text-lg">み</div>
            <span class="font-display font-black text-xl text-charcoal">みかん (Mikan)</span>

        <div>

            <li><a href="#news" onclick="navigateTo('news', event)" class="hover:text-mikan-500 transition-colors">お知らせ</a></li>

      <div class="pt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-neutral-500">
        <p>&copy; 2026 みかん (Mikan). All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- Application Logic & Data -->
  <script>
    // ==========================================
    // 1. State & Configuration
    // ==========================================
    const DISCORD_USER_ID = '1498667817481011301';

    const STATE = {
      currentRoute: 'home',
      cmsConfig: {
        serviceDomain: 'swe2db8jva',
        apiKey: 'ksq03pQ5FRz9yDM47YPDyxlqhzlQir5TGStQ',
        endpoint: 'news'
      },
      cmsStatus: 'idle', // 'idle' | 'loading' | 'success' | 'error'
      cmsArticles: [],
      discord: {
        avatarUrl: null,
        status: 'offline', // 'online' | 'idle' | 'dnd' | 'offline'
        username: 'みかん'
      }
    };

    // Fallback News Articles (Displayed silently if microCMS endpoint has no entries or is unreachable)
    const FALLBACK_NEWS = [
      {
        id: 'sample-1',
        title: '「みかん」公式ホームページをリニューアル公開しました！',
        publishedAt: '2026-11-15T10:00:00.000Z',
        category: { name: 'お知らせ' },
        content: '<p>いつも応援ありがとうございます。「みかん」の公式ホームページを新しくオープンいたしました！</p><p>新しいサイトでは、日々の活動のお知らせやSNSでの発信情報をまとめてお届けしていきます。</p><h2>今後の予定</h2><ul><li>新作Web企画の公開</li><li>デザイン制作の裏話や技術メモの更新</li><li>SNSでの活動発信強化</li></ul><p>今後ともどうぞよろしくお願いいたします。</p>'
      },
      {
        id: 'sample-2',
        title: '冬のクリエイターイベントに出展・参加します',
        publishedAt: '2026-10-20T09:00:00.000Z',
        category: { name: 'イベント' },
        content: '<p>来月開催されるオンライン＆オフライン合同のクリエイター展示会に参加することが決定しました。</p><p>当日はオリジナルグッズやUIデザイン資料の展示を予定しています。詳細はSNSでも順次お知らせいたします。</p>'
      },
      {
        id: 'sample-3',
        title: 'Discordコミュニティ「みかん箱」を開設しました',
        publishedAt: '2026-10-05T18:00:00.000Z',
        category: { name: 'コミュニティ' },
        content: '<p>クリエイター同士の雑談やアイデア交換ができるDiscordサーバーを開設しました。SNSページからぜひご参加ください。</p>'
      }
    ];

    // Social Links Data
    const SNS_DATA = [
      {
        name: 'X (Twitter)',
        handle: '@mikan3nd',
        description: '日々の制作進捗やお知らせは、こちらのXアカウントで発信しています。',
        url: 'https://x.com/mikan3nd',
        badge: 'メインアカウント',
        bgClass: 'bg-neutral-900 text-white',
        accentClass: 'border-neutral-200 hover:border-neutral-900',
        iconSvg: `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`
      }
    ];

    // ==========================================
    // 2. Discord Lanyard API & microCMS Fetch Logic
    // ==========================================
    async function fetchDiscordLanyard() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`, {
          cache: 'no-store'
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const json = await res.json();
        if (json && json.success && json.data) {
          const user = json.data.discord_user;
          STATE.discord.status = json.data.discord_status || 'offline';
          if (user) {
            STATE.discord.username = user.global_name || user.username || 'みかん';
            if (user.avatar) {
              const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
              STATE.discord.avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=512`;
            } else {
              // New Discord username system uses (user_id >> 22) % 6, legacy uses discriminator % 5
              const defaultIdx = (user.discriminator && user.discriminator !== '0')
                ? Number(user.discriminator) % 5
                : Number((BigInt(user.id) >> 22n) % 6n);
              STATE.discord.avatarUrl = `https://cdn.discordapp.com/embed/avatars/${defaultIdx}.png`;
            }
          }
        }
      } catch (e) {
        // Fallback to Discord default embed avatar computed from user ID
        const defaultIdx = Number((BigInt(DISCORD_USER_ID) >> 22n) % 6n);
        STATE.discord.avatarUrl = `https://cdn.discordapp.com/embed/avatars/${defaultIdx}.png`;
      }

      if (STATE.currentRoute === 'home') {
        renderCurrentPage();
      }
    }

    async function fetchMicroCMSNews() {
      const { serviceDomain, apiKey, endpoint } = STATE.cmsConfig;
      STATE.cmsStatus = 'loading';

      const cleanDomain = serviceDomain.trim();
      const cleanEndpoint = endpoint.trim() || 'news';
      const url = `https://${cleanDomain}.microcms.io/api/v1/${cleanEndpoint}`;

      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'X-MICROCMS-API-KEY': apiKey.trim()
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const items = Array.isArray(data.contents) ? data.contents : (data.id ? [data] : []);
        STATE.cmsArticles = items;
        STATE.cmsStatus = 'success';
      } catch (err) {
        STATE.cmsStatus = 'error';
      }

      if (STATE.currentRoute === 'news' || STATE.currentRoute === 'home') {
        renderCurrentPage();
      }
    }

    // Helper to get active news list (live microCMS or silent fallback)
    function getDisplayNews() {
      if (STATE.cmsStatus === 'success' && STATE.cmsArticles.length > 0) {
        return STATE.cmsArticles;
      }
      return FALLBACK_NEWS;
    }

    // Format ISO Date to YYYY.MM.DD
    function formatDate(isoString) {
      if (!isoString) return '2026.11.20';
      try {
        const d = new Date(isoString);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}.${m}.${day}`;
      } catch {
        return isoString.slice(0, 10);
      }
    }

    // Strip HTML tags for plain text excerpt
    function stripHtml(html) {
      if (!html) return '';
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    // ==========================================
    // 3. Router & Navigation
    // ==========================================
    const VALID_ROUTES = ['home', 'news', 'sns', 'contact', '404'];

    function navigateTo(route, event) {
      if (event) event.preventDefault();
      const targetRoute = VALID_ROUTES.includes(route) ? route : '404';
      STATE.currentRoute = targetRoute;
      window.location.hash = targetRoute;
      updateActiveNav();
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateActiveNav() {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const r = btn.getAttribute('data-route');
        if (r === STATE.currentRoute) {
          btn.classList.add('bg-mikan-500', 'text-white', 'shadow-sm');
          btn.classList.remove('text-charcoal', 'hover:bg-mikan-100');
        } else {
          btn.classList.remove('bg-mikan-500', 'text-white', 'shadow-sm');
          btn.classList.add('text-charcoal', 'hover:bg-mikan-100');
        }
      });

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        const r = btn.getAttribute('data-route');
        if (r === STATE.currentRoute) {
          btn.classList.add('bg-mikan-100', 'text-mikan-700');
        } else {
          btn.classList.remove('bg-mikan-100', 'text-mikan-700');
        }
      });
    }

    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3200);
    }

    // ==========================================
    // 4. Page Renderers
    // ==========================================
    function renderCurrentPage() {
      const container = document.getElementById('app-view');
      let html = '';

      switch (STATE.currentRoute) {
        case 'home':
          html = renderHomePage();
          break;
        case 'news':
          html = renderNewsPage();
          break;
        case 'sns':
          html = renderSnsPage();
          break;
        case 'contact':
          html = renderContactPage();
          break;
        default:
          html = render404Page();
          break;
      }

      container.innerHTML = `<div class="page-transition">${html}</div>`;
      lucide.createIcons();
    }

    // --- 4.1 HOME PAGE ---
    function renderHomePage() {
      const newsItems = getDisplayNews();
      const latestNews = newsItems.slice(0, 3);

      const statusConfig = {
        online: { color: 'bg-emerald-500', label: 'Online' },
        idle: { color: 'bg-amber-400', label: 'Idle' },
        dnd: { color: 'bg-rose-500', label: 'Do Not Disturb' },
        offline: { color: 'bg-neutral-400', label: 'Offline' }
      };
      const currentStatus = statusConfig[STATE.discord.status] || statusConfig.offline;

      const defaultDiscordIdx = Number((BigInt(DISCORD_USER_ID) >> 22n) % 6n);
      const defaultDiscordAvatar = `https://cdn.discordapp.com/embed/avatars/${defaultDiscordIdx}.png`;

      return `
        <!-- Hero Section -->
        <section class="relative bg-white rounded-[2rem] border border-mikan-100 shadow-soft p-8 sm:p-14 overflow-hidden mb-16">
          <div class="flex flex-col sm:flex-row items-center justify-between gap-8 sm:gap-12">
            <!-- Left: Large Name -->
            <div class="text-center sm:text-left">
              <h1 class="font-display font-black text-5xl sm:text-7xl md:text-8xl text-charcoal tracking-tight">
                みかん
              </h1>
            </div>

            <!-- Right: Discord Avatar (Lanyard API) -->
            <div class="flex justify-center shrink-0">
              <div class="relative w-48 h-48 sm:w-64 sm:h-64 flex items-center justify-center animate-float">
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-mikan-300/60 to-mikan-100/50 blur-2xl"></div>
                <div class="relative w-44 h-44 sm:w-60 sm:h-60 rounded-full p-2 bg-gradient-to-br from-mikan-400 via-mikan-300 to-amber-200 shadow-xl">
                  <div class="w-full h-full rounded-full overflow-hidden bg-neutral-100 flex items-center justify-center">
                    ${STATE.discord.avatarUrl
                      ? `<img src="${STATE.discord.avatarUrl}" alt="${STATE.discord.username}のアイコン" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='${defaultDiscordAvatar}';" class="w-full h-full object-cover" />`
                      : `<div class="w-full h-full bg-neutral-200 animate-pulse flex items-center justify-center text-neutral-400">
                           <i data-lucide="user" class="w-16 h-16"></i>
                         </div>`
                    }
                  </div>
                  <!-- Discord Status Indicator Dot -->
                  <div title="Discord Status: ${currentStatus.label}" class="absolute bottom-2 right-2 sm:bottom-4 sm:right-4 w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-white p-1.5 shadow-md flex items-center justify-center">
                    <span class="w-full h-full rounded-full ${currentStatus.color} block"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Latest News Excerpt -->
        <section class="bg-white rounded-[2rem] border border-mikan-100 p-6 sm:p-10 shadow-card">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 gap-4">
            <h2 class="font-display font-black text-2xl text-charcoal">最新のお知らせ</h2>
            <button onclick="navigateTo('news')" class="inline-flex items-center gap-1.5 text-sm font-bold text-mikan-600 hover:text-mikan-700">
              お知らせ一覧へ <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="divide-y divide-mikan-100">
            ${latestNews.map((item, idx) => {
              const catName = item.category?.name || item.category || 'お知らせ';
              return `
                <article onclick="openNewsModal(${idx})" class="py-4 first:pt-0 last:pb-0 flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-6 cursor-pointer group">
                  <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                    <div class="flex items-center gap-2.5 shrink-0">
                      <time class="text-xs font-bold text-neutral-400 font-mono">${formatDate(item.publishedAt || item.createdAt)}</time>

    // --- 4.2 NEWS PAGE (microCMS Backend Integration without status/config UI) ---
    function renderNewsPage() {
      const displayArticles = getDisplayNews();

      return `
        <div class="space-y-8">
          <!-- Page Header -->
          <div class="bg-white rounded-[2rem] border border-mikan-100 p-8 sm:p-10 shadow-card">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-mikan-50 text-mikan-700 text-xs font-bold mb-2">

            </div>
            <h1 class="font-display font-black text-3xl sm:text-4xl text-charcoal">お知らせ</h1>

          <div class="space-y-4">
            ${displayArticles.map((article, idx) => {

              const excerpt = stripHtml(article.content || article.body || article.description || '記事の詳細をクリックしてご覧ください。');
              return `
                <article onclick="openNewsModal(${idx})" class="group cursor-pointer bg-white rounded-3xl border border-mikan-100 p-6 sm:p-7 shadow-card hover:shadow-soft hover:border-mikan-300 transition-all">

                    <time class="text-xs font-bold font-mono text-neutral-400">${formatDate(article.publishedAt || article.createdAt)}</time>

                  </div>
                  <h2 class="font-display font-bold text-lg sm:text-xl text-charcoal group-hover:text-mikan-500 transition-colors">
                    ${article.title || '無題のお知らせ'}
                  </h2>
                  <p class="text-sm text-neutral-600 mt-2 line-clamp-2 leading-relaxed">
                    ${excerpt}
                  </p>
                  <div class="mt-4 flex items-center text-xs font-bold text-mikan-600 group-hover:translate-x-1 transition-transform">

    // --- 4.3 SNS PAGE ---
    function renderSnsPage() {
      return `
        <div class="space-y-8">
          <div class="bg-white rounded-[2rem] border border-mikan-100 p-8 sm:p-10 shadow-card text-center max-w-3xl mx-auto">
            <span class="text-xs font-bold tracking-widest text-mikan-500 uppercase">Social Media</span>
            <h1 class="font-display font-black text-3xl sm:text-4xl text-charcoal mt-1">公式SNS・コミュニティ</h1>
            <p class="text-neutral-600 text-sm sm:text-base mt-3">
              「みかん」の最新情報や制作の裏側、日々のつぶやきは各種SNSで発信しています。<br class="hidden sm:inline">
              ぜひ気軽にフォローやメッセージをお寄せください！
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            ${SNS_DATA.map(sns => `
              <div class="bg-white rounded-3xl border-2 ${sns.accentClass} p-6 shadow-card hover:shadow-soft transition-all flex flex-col justify-between">
                <div>
                  <div class="flex items-start justify-between mb-4">
                    <div class="w-12 h-12 rounded-2xl ${sns.bgClass} flex items-center justify-center shadow-sm">
                      ${sns.iconSvg}
                    </div>
                    <span class="px-3 py-1 rounded-full bg-mikan-50 text-mikan-700 text-xs font-bold">${sns.badge}</span>
                  </div>
                  <h2 class="font-display font-bold text-xl text-charcoal">${sns.name}</h2>
                  <p class="text-xs font-mono font-bold text-neutral-400 mt-0.5">${sns.handle}</p>
                  <p class="text-sm text-neutral-600 mt-3 leading-relaxed">
                    ${sns.description}
                  </p>
                </div>

                <div class="mt-6 pt-4 border-t border-neutral-100 flex items-center gap-2">
                  <a href="${sns.url}" target="_blank" rel="noopener noreferrer" class="flex-grow py-2.5 px-4 rounded-xl bg-mikan-50 hover:bg-mikan-500 text-mikan-700 hover:text-white font-bold text-xs text-center transition-colors flex items-center justify-center gap-1.5">
                    フォロー・開く <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  </a>
                  <button onclick="copyHandle('${sns.handle}')" class="p-2.5 rounded-xl bg-neutral-100 hover:bg-neutral-200 text-neutral-600 transition-colors" title="IDをコピー">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function copyHandle(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast(`「${text}」をクリップボードにコピーしました`);
    }

    // --- 4.5 CONTACT PAGE ---
    function renderContactPage() {
      return `

              <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

    }

    function handleContactSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('contact-form');
      const success = document.getElementById('contact-success');
      form.classList.add('hidden');
      success.classList.remove('hidden');
      showToast('お問い合わせを受け付けました（デモ送信）');
    }

    function resetContactForm() {
      const form = document.getElementById('contact-form');
      const success = document.getElementById('contact-success');
      form.reset();
      success.classList.add('hidden');
      form.classList.remove('hidden');
    }

    // --- 4.6 404 NOT FOUND PAGE ---

        <div class="max-w-2xl mx-auto text-center py-8 sm:py-12">
          <div class="bg-white rounded-[2.5rem] border border-mikan-100 p-8 sm:p-14 shadow-soft space-y-6">
            <!-- Peeled Mikan Illustration SVG -->

              <p class="text-sm sm:text-base text-neutral-600 max-w-md mx-auto pt-2 leading-relaxed">
                アクセスしようとしたページは削除されたか、URLが変更された可能性があります。こたつに戻ってトップページからお探しください。

    // ==========================================
    // 5. Modals (News Detail)
    // ==========================================
    function openNewsModal(index) {
      const items = getDisplayNews();
      const article = items[index];
      if (!article) return;

      const catName = article.category?.name || article.category || 'お知らせ';
      const bodyHtml = article.content || article.body || `<p>${article.description || '本文データがありません。'}</p>`;

      const modalBody = document.getElementById('modal-body');
      modalBody.innerHTML = `
        <article class="space-y-5">
          <div class="flex flex-wrap items-center gap-2.5">
            <time class="text-xs font-bold font-mono text-neutral-400">${formatDate(article.publishedAt || article.createdAt)}</time>
            <span class="px-3 py-0.5 rounded-full bg-mikan-100 text-mikan-800 text-xs font-bold">${catName}</span>
          </div>

          <h2 class="font-display font-black text-2xl sm:text-3xl text-charcoal leading-snug">
            ${article.title || '無題のお知らせ'}
          </h2>

          ${article.eyecatch?.url ? `
            <img src="${article.eyecatch.url}" alt="${article.title}" class="w-full h-56 object-cover rounded-2xl border border-mikan-100" />
          ` : ''}

          <div class="pt-4 border-t border-mikan-100 text-sm sm:text-base text-neutral-700 cms-content">
            ${bodyHtml}
          </div>
        </article>
      `;
      openModal();
    }

    function openModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('detail-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'detail-modal') {
        closeModal();
      }
    }

    // ==========================================
    // 6. Initialization
    // ==========================================
    window.addEventListener('hashchange', () => {
      const hashRoute = window.location.hash.replace('#', '') || 'home';
      STATE.currentRoute = VALID_ROUTES.includes(hashRoute) ? hashRoute : '404';
      updateActiveNav();
      renderCurrentPage();
    });

    window.addEventListener('DOMContentLoaded', () => {
      const initialHash = window.location.hash.replace('#', '');
      if (initialHash) {
        STATE.currentRoute = VALID_ROUTES.includes(initialHash) ? initialHash : '404';
      }
      updateActiveNav();
      renderCurrentPage();
      // Fetch Discord avatar & status via Lanyard API
      fetchDiscordLanyard();
      // Fetch news articles from microCMS silently
      fetchMicroCMSNews();
    });
  </script>
