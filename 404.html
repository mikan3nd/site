<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2B58">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="お探しのページが見つかりませんでした。みかん公式サイトのページ一覧からお探しください。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <title>ページが見つかりません | みかん</title>
</head>
<body data-page="404" data-root="./" class="min-h-screen flex flex-col">
  <main id="app-view" tabindex="-1">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <span class="not-found-kicker"><span aria-hidden="true">●</span> 404 / PAGE NOT FOUND</span>
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1 class="not-found-title" id="not-found-title">お探しのページが見つかりません</h1>
      <p class="not-found-copy">URLが正しく入力されているかご確認ください。ページが移動・削除された可能性もあります。下のリンクから目的のページをお探しいただけます。</p>
      <div class="not-found-actions">
        <a class="primary" data-route="home" href="./">ホームへ戻る</a>
        <a data-route="products" href="./products/">プロダクト</a>
        <a data-route="news" href="./news/">お知らせ</a>
        <a data-route="about" href="./about/">About</a>
        <a data-route="sns" href="./sns/">SNS</a>
        <a data-route="contact" href="./contact/">お問い合わせ</a>
      </div>
      <p class="not-found-help">リンク切れや不具合を見つけた場合は、<a href="./contact/">お問い合わせページ</a>からお知らせください。</p>
    </section>
  </main>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/utils.js"></script>
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/modals.js"></script>
</body>
</html>
