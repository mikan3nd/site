<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E2B58">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="お探しのページが見つかりませんでした。みかん公式サイトのホームや各ページをご覧ください。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="./assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="./assets/css/styles.css">
  <title>ページが見つかりません | みかん</title>
</head>
<body data-page="404" data-root="./" class="min-h-screen flex flex-col">
  <main id="app-view">
    <section class="not-found-card" aria-labelledby="not-found-title">
      <span class="not-found-kicker"><span aria-hidden="true">●</span> 404 / PAGE NOT FOUND</span>
      <p class="not-found-code" aria-hidden="true">404</p>
      <h1 class="not-found-title" id="not-found-title">このページは見つかりませんでした</h1>
      <p class="not-found-copy">ページが移動または削除されたか、URLが間違っている可能性があります。お探しの情報は、以下のページから見つけられるかもしれません。</p>
      <div class="not-found-actions">
        <a class="primary" data-route="home" href="./">ホームに戻る</a>
        <a data-route="products" href="./products/">プロダクトを見る</a>
        <a data-route="news" href="./news/">お知らせを見る</a>
      </div>
    </section>
  </main>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/utils.js"></script>
  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/modals.js"></script>
</body>
</html>
